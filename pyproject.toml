[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Google Search Console: queries, pages, period comparison, traffic drops, CTR gaps, striking distance, cannibalization and URL inspection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gsc-mcp-server = "gsc_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
